<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Simple Chat Bot</title>
	</head>
	<body>
		<div class="chat-container">
			<div
				id="chat-window"
				class="chat-window"
			></div>
			<input
				type="text"
				id="user-input"
				placeholder="Type your message..."
			/>
			<button id="send-button">
				Send
			</button>
		</div>
		<script src="script.js"></script>
	</body>
</html>
